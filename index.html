<script>
  /* ↓ 這是 Apps Script 的網址，換後台時改這一行就好 ↓ */
  window.API_URL = "https://script.google.com/macros/s/AKfycbwzomM0U0En-LccK3eJXH0gHZFVN36_IvjRFMUi4NE3_C9hm_1Zfns1WfoLwJD82Di2/exec";
  /* 不等網頁其他東西載完，先把資料要求丟出去，省下約 200 毫秒 */
  try {
    window.__boot = fetch(window.API_URL + "?action=bootstrap", { cache: "no-store" })
      .then(function (r) { return r.text(); });

<title>沛力每月小挑戰</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap">

<style>
  :root{
    --ink:#F6F5F4;              /* 頁面底色 */
    --panel:#FFFFFF;            /* 卡片 */
    --panel-2:#F2F0EE;          /* 輸入框 */
    --line:rgba(0,0,0,.10);
    --line-strong:rgba(0,0,0,.22);
    --accent:#F05A32;           /* 色塊與按鈕，沛力的橘 */
    --accent-hot:#B8401B;       /* 白底上當文字或 hover 用的深橘 */
    --accent-dim:rgba(240,90,50,.12);
    --text:#17130F;
    --muted:#6B645D;
    --muted-2:#9B938B;
    --gold:#B07C12;
    --silver:#7E848A;
    --bronze:#A05C33;
    --ok:#1E7A45;

    --display:"Barlow Condensed","PingFang TC","Noto Sans TC",sans-serif;
    --body:"DM Sans","PingFang TC","Noto Sans TC",system-ui,sans-serif;
  }

  html,body{background:var(--ink);}
  body{
    margin:0;
    font-family:var(--body);
    color:var(--text);
    font-size:15px;
    line-height:1.55;
  }
  *{box-sizing:border-box;}
  [hidden]{display:none !important;}   /* 否則 .months 的 display:flex 會蓋掉 hidden */
  button{font:inherit;color:inherit;}
  :focus-visible{outline:2px solid var(--accent-hot);outline-offset:2px;}

  .wrap{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:0 56px;}

  /* ---------- header ---------- */
  .topbar{
    position:sticky;top:env(safe-area-inset-top,0px);z-index:20;
    background:rgba(255,255,255,.92);
    backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);
  }
  .topbar-in{max-width:560px;margin:0 auto;padding:12px 16px;display:flex;align-items:center;gap:12px;}
  .mark{display:flex;align-items:baseline;gap:6px;font-family:var(--display);letter-spacing:.06em;}
  .mark b{font-weight:700;font-size:20px;}
  .mark span{font-weight:500;font-size:20px;color:var(--muted);}
  .mark-rule{width:34px;height:3px;background:var(--accent);margin-top:5px;}
  .topbar h1{
    margin:0;font-family:var(--display);font-weight:600;font-size:17px;
    letter-spacing:.04em;color:var(--muted);margin-left:auto;
  }

  /* ---------- month strip ---------- */
  .months{display:flex;gap:8px;overflow-x:auto;padding:14px 0 2px;scrollbar-width:none;}
  .months::-webkit-scrollbar{display:none;}
  .month{
    flex:0 0 auto;padding:7px 14px;border-radius:999px;cursor:pointer;
    background:var(--panel);border:1px solid var(--line);color:var(--muted);
    font-family:var(--display);font-size:16px;font-weight:600;letter-spacing:.03em;
    white-space:nowrap;transition:background .15s,color .15s,border-color .15s;
  }
  .month:hover{border-color:var(--line-strong);color:var(--text);}
  .month[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:#fff;}
  .month .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--ok);margin-right:6px;vertical-align:middle;}

  /* ---------- whiteboard ---------- */
  .board{
    margin-top:16px;background:var(--panel);
    border:1px solid var(--line);border-top:3px solid var(--accent);
    padding:20px 18px 18px;
  }
  .board-title{margin:6px 0 0;font-family:var(--display);font-weight:700;font-size:30px;line-height:1.1;letter-spacing:.02em;text-wrap:balance;}
  .board-kind{
    font-family:var(--display);font-size:13px;font-weight:600;letter-spacing:.14em;
    color:var(--accent-hot);text-transform:uppercase;display:block;margin-bottom:4px;
  }
  .window{margin:9px 0 0;font-size:12px;color:var(--muted-2);letter-spacing:.02em;}
  .timecap{
    display:inline-flex;align-items:baseline;gap:9px;margin-top:12px;
    border:1.5px solid var(--accent);padding:5px 12px;
  }
  .timecap .k{font-family:var(--display);font-size:13px;font-weight:700;letter-spacing:.1em;color:var(--accent-hot);}
  .timecap .v{
    font-family:var(--display);font-size:23px;font-weight:700;line-height:1;
    color:var(--text);font-variant-numeric:tabular-nums;
  }

  .stations{list-style:none;margin:18px 0 0;padding:0;border-top:1px dashed var(--line-strong);}
  .stations li{
    display:flex;align-items:baseline;gap:12px;
    padding:11px 0;border-bottom:1px dashed var(--line);
  }
  .st-no{
    font-family:var(--display);font-size:13px;font-weight:600;color:var(--muted-2);
    width:18px;flex:0 0 18px;font-variant-numeric:tabular-nums;
  }
  .st-name{flex:1;min-width:0;font-size:15px;}
  .st-qty{
    font-family:var(--display);font-size:22px;font-weight:700;line-height:1;
    flex:0 0 auto;text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums;
  }
  .st-load{display:flex;gap:7px;flex-wrap:wrap;margin-top:4px;}
  .st-load .tag{
    display:inline-flex;align-items:baseline;gap:5px;
    padding:2px 8px;font-size:13px;font-weight:700;
    font-variant-numeric:tabular-nums;
  }
  .st-load .tag b{font-family:var(--display);font-size:14px;letter-spacing:.04em;font-weight:700;}
  .st-load .m{color:#1B6AA8;background:rgba(27,106,168,.11);}   /* 男 */
  .st-load .f{color:#B83A72;background:rgba(184,58,114,.11);}   /* 女 */
  .st-load .off{opacity:.34;}                                    /* 不是你那組就淡掉 */
  .st-load .lv{
    display:inline-block;min-width:26px;text-align:center;
    font-family:var(--display);font-size:11.5px;font-weight:700;letter-spacing:.08em;
    padding:1px 5px;line-height:1.2;
  }
  .st-load .lv.rx{color:#FFFFFF;background:#1F1A16;}
  .st-load .lv.sc{color:#6B4A2F;background:#EADDCB;}
  .st-load.dim{opacity:.4;}                                      /* 不是你選的強度就整排淡掉 */

  /* 排行榜上的強度標記 */
  .divtag{
    display:inline-block;min-width:26px;text-align:center;
    font-family:var(--display);font-size:12px;font-weight:700;letter-spacing:.08em;
    padding:2px 6px;margin-left:7px;vertical-align:1px;line-height:1.1;
  }
  .divtag.rx{color:#FFFFFF;background:#1F1A16;}   /* 標準：實心深色 */
  .divtag.sc{color:#6B4A2F;background:#EADDCB;}   /* 降階：淺灰 */

  .board-note{margin:14px 0 0;font-size:13px;color:var(--muted);line-height:1.6;}

  /* ---------- 本月概況：一行就夠 ---------- */
  .stats{
    margin:15px 0 0;padding-top:13px;border-top:1px solid var(--line);
    font-size:12.5px;color:var(--muted-2);font-variant-numeric:tabular-nums;
  }
  .stats b{font-family:var(--display);font-size:17px;font-weight:700;color:var(--text);margin:0 1px;}

  /* ---------- section heading ---------- */
  .sec{margin-top:30px;}
  .sec-head{margin:0 0 10px;font-family:var(--display);font-size:20px;font-weight:700;letter-spacing:.05em;}

  /* ---------- tabs ---------- */
  .tabs{display:flex;border:1px solid var(--line);background:var(--panel);}
  .tab{
    flex:1;padding:9px 0;text-align:center;cursor:pointer;background:none;border:0;
    font-family:var(--display);font-size:16px;font-weight:600;letter-spacing:.06em;color:var(--muted);
    border-right:1px solid var(--line);transition:background .15s,color .15s;
  }
  .tab:last-child{border-right:0;}
  .tab em{font-style:normal;margin-left:7px;font-size:13px;color:var(--muted-2);font-variant-numeric:tabular-nums;}
  .tab[aria-selected="true"] em{color:var(--accent-hot);}
  .tab[aria-selected="true"]{background:var(--accent-dim);color:var(--accent-hot);box-shadow:inset 0 -2px 0 var(--accent);}

  /* ---------- leaderboard ---------- */
  .lb{list-style:none;margin:0;padding:0;border:1px solid var(--line);border-top:0;}
  .empty{border-top:0;}
  .lb li{display:grid;grid-template-columns:36px 1fr auto;gap:12px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line);background:var(--panel);}
  .lb li:last-child{border-bottom:0;}
  .lb li.me{background:linear-gradient(90deg,var(--accent-dim),transparent 70%);box-shadow:inset 2px 0 0 var(--accent);}
  .rank{font-family:var(--display);font-size:24px;font-weight:700;line-height:1;color:var(--muted-2);font-variant-numeric:tabular-nums;text-align:center;}
  .rank.r1{color:var(--gold);} .rank.r2{color:var(--silver);} .rank.r3{color:var(--bronze);}
  .who{min-width:0;}
  .name{font-weight:500;}
  .name.coach{color:#12518C;font-weight:700;}   /* 教練 */
  .name em{font-style:normal;color:var(--muted-2);font-size:12px;margin-left:5px;font-variant-numeric:tabular-nums;}
  .note{font-size:12.5px;color:var(--muted);margin-top:2px;overflow-wrap:anywhere;}
  .score{text-align:right;}
  .score b{font-family:var(--display);font-size:23px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums;}
  .score span{display:block;font-size:11.5px;color:var(--muted-2);margin-top:3px;white-space:nowrap;}
  .score b.cap{font-size:16px;letter-spacing:.1em;color:var(--muted-2);}
  .lb li.dnf .rank{color:var(--muted-2);opacity:.65;}
  .lb li.dnf .name{color:var(--muted);}
  .empty{padding:26px 14px;text-align:center;color:var(--muted-2);font-size:14px;background:var(--panel);border:1px solid var(--line);border-top:0;}

  /* ---------- form ---------- */
  .form{border:1px solid var(--line);background:var(--panel);padding:18px 16px;}
  .row{display:flex;gap:10px;flex-wrap:wrap;}
  .field{flex:1 1 150px;min-width:0;margin-bottom:13px;}
  .field.full{flex:1 1 100%;}
  label{display:block;font-size:12px;color:var(--muted);letter-spacing:.04em;margin-bottom:5px;}
  input,select,textarea{
    width:100%;background:var(--panel-2);border:1px solid var(--line);color:var(--text);
    padding:10px 11px;font-family:var(--body);font-size:15px;border-radius:0;
  }
  input::placeholder,textarea::placeholder{color:#A9A29B;}
  input:focus,select:focus,textarea:focus{border-color:var(--accent-hot);outline:none;}
  textarea{resize:vertical;min-height:62px;}
  .seg{display:flex;gap:0;}
  .seg button{
    flex:1;padding:10px 0;background:var(--panel-2);border:1px solid var(--line);
    cursor:pointer;font-family:var(--display);font-size:16px;font-weight:600;letter-spacing:.06em;color:var(--muted);
  }
  .seg button+button{border-left:0;}
  .seg button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff;}

  .preview{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:0 0 14px;}
  .preview .lbl{font-size:12px;color:var(--muted);letter-spacing:.04em;}
  .preview .val{font-family:var(--display);font-size:24px;font-weight:700;line-height:1;font-variant-numeric:tabular-nums;}

  .submit{
    width:100%;padding:14px;background:var(--accent);border:0;cursor:pointer;color:#fff;
    font-family:var(--display);font-size:19px;font-weight:700;letter-spacing:.1em;
    transition:background .15s;
  }
  .submit:hover{background:var(--accent-hot);}
  .submit:disabled{background:var(--panel-2);color:var(--muted-2);cursor:not-allowed;}
  .locked{padding:16px;color:var(--muted);font-size:14px;}
  .hint{font-size:12px;color:var(--muted-2);margin:9px 0 0;line-height:1.6;}

  /* ---------- history ---------- */
  .hist{border:1px solid var(--line);background:var(--panel);padding:16px;}
  .hist-rows{list-style:none;margin:14px 0 0;padding:0;display:flex;flex-direction:column;gap:12px;}
  .hist-rows li{display:grid;grid-template-columns:52px 1fr 60px;gap:10px;align-items:center;}
  .h-month{font-family:var(--display);font-size:15px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums;}
  .h-track{height:22px;background:var(--panel-2);position:relative;}
  .h-fill{height:100%;background:var(--accent);display:flex;align-items:center;padding-left:8px;min-width:fit-content;}
  .h-fill b{font-family:var(--display);font-size:14px;font-weight:700;letter-spacing:.03em;white-space:nowrap;}
  .h-rank{text-align:right;font-family:var(--display);font-size:18px;font-weight:700;font-variant-numeric:tabular-nums;}
  .h-rank small{font-size:11px;color:var(--muted-2);font-weight:500;}

  .demo{
    margin-top:30px;border:1px solid var(--line);background:var(--panel-2);
    padding:13px 15px;font-size:12.5px;color:var(--muted);line-height:1.65;
  }
  .demo b{color:var(--accent-hot);}

  /* ---------- 系統訊息 ---------- */
  /* 資料還沒回來之前，只留提示與載入字樣，免得閃出一份不存在的課表 */
  .wrap.is-loading > *:not(#banner):not(#loading){display:none;}
  .banner{margin-top:14px;padding:10px 13px;font-size:12.5px;line-height:1.6;border-left:2px solid var(--accent);background:var(--accent-dim);color:var(--muted);}
  .banner b{color:var(--text);}
  .banner.bad{border-left-color:#C0392B;background:rgba(192,57,43,.08);}
  .loading{padding:50px 0;text-align:center;color:var(--muted-2);font-family:var(--display);font-size:18px;letter-spacing:.08em;}
  .btn-lookup{
    width:100%;padding:10px;margin-top:2px;background:transparent;border:1px solid var(--line-strong);
    color:var(--muted);cursor:pointer;font-family:var(--display);font-size:16px;font-weight:600;letter-spacing:.08em;
  }
  .btn-lookup:hover{border-color:var(--accent-hot);color:var(--accent-hot);}
  .submit[aria-busy="true"]{background:var(--panel-2);color:var(--muted-2);}

  @media (prefers-reduced-motion:reduce){*{transition:none!important;}}
</style>

<script>
/* ==========================================================================
   沛力訓練每月小挑戰 — 學生端
   把下面的 API_URL 換成 Apps Script 部署後拿到的網址（結尾是 /exec）。
   沒填的話頁面會用示範資料跑，方便先看畫面。
   ========================================================================== */

const API_URL = window.API_URL || "PASTE_APPS_SCRIPT_URL_HERE";

const LIVE = /^https:\/\/script\.google\.com\/.+\/exec$/.test(API_URL);
const $ = id => document.getElementById(id);

let MONTHS = [];
let monthId = null;
let sex = "M";
let formSex = "M";
let formDiv = "rx";              // Rx 或 sc（降階）
let formDone = true;
let myPid = null;
let busy = false;

try { myPid = localStorage.getItem("peri.pid"); } catch(e) {}

const cur = () => MONTHS.find(m => m.id === monthId) || MONTHS[0];
const isDnf = r => r.sec == null;

/* ---------------- 與後端溝通 ----------------
   POST 用純字串 body，瀏覽器會送 text/plain，屬於簡單請求，
   不會觸發 Apps Script 處理不了的 CORS 預檢。
------------------------------------------------ */

// Apps Script 的轉址偶爾會吐出 HTML 錯誤頁（實測約十次一次），所以重試幾遍再放棄。
// 交成績是「同一人同月覆蓋」的設計，重試不會變成兩筆。
async function fetchJSON(url, opts, tries){
  tries = tries || 3;
  let last;
  for(let i = 0; i < tries; i++){
    try{
      const res = await fetch(url, opts);
      if(!res.ok) throw new Error("伺服器回應 " + res.status);
      return JSON.parse(await res.text());   // 拿到 HTML 會在這裡丟例外，觸發重試
    }catch(err){
      last = err;
      if(i < tries - 1) await new Promise(r => setTimeout(r, 700 * (i + 1)));
    }
  }
  throw last;
}

async function api(action, payload){
  return fetchJSON(API_URL, {
    method:"POST",
    body: JSON.stringify(Object.assign({action}, payload || {}))
  });
}
async function fetchBootstrap(){
  let j = null;
  if(window.__boot){                       // 用頁面最上面就先發出去的那一趟
    const p = window.__boot; window.__boot = null;
    try{ j = JSON.parse(await p); }catch(err){ j = null; }
  }
  if(!j) j = await fetchJSON(API_URL + "?action=bootstrap");
  if(!j.ok) throw new Error(j.error || "讀取失敗");
  return j.data;
}

/* 上次看到的內容存在這台手機裡，下次開啟先拿它畫，不用乾等 Apps Script 回應。
   畫完之後照樣在背景重新抓一次，有變動就蓋掉。 */
const SNAP_KEY = "peri.snapshot.v1";
const SNAP_MAX_AGE = 7 * 24 * 3600 * 1000;     // 太久沒開就別用舊的了

function saveSnapshot(data){
  try{ localStorage.setItem(SNAP_KEY, JSON.stringify({t:Date.now(), data})); }catch(e){}
}
function loadSnapshot(){
  try{
    const o = JSON.parse(localStorage.getItem(SNAP_KEY) || "null");
    if(!o || !o.data || !Array.isArray(o.data.months)) return null;
    if(Date.now() - o.t > SNAP_MAX_AGE) return null;
    return o.data;
  }catch(e){ return null; }
}

function banner(html, bad){
  const b = $("banner");
  b.innerHTML = html;
  b.className = "banner" + (bad ? " bad" : "");
  b.hidden = false;
}

/* ---------------- 排名 ---------------- */

// 未完賽的三層比較：輪數 → 停在第幾站 → 該站完成量。
// 各站單位不同（下 / 公尺 / cal），但只有同站才互比，所以不需要換算。
// Rx 一律排在 Scaled 之前，這是 CrossFit 的慣例
const divTier = r => (r.div === "sc" ? 1 : 0);

function cmpProgress(a,b){
  const ka = [a.rounds,a.st,a.part], kb = [b.rounds,b.st,b.part];
  for(let i=0;i<3;i++) if(ka[i]!==kb[i]) return kb[i]-ka[i];
  return 0;
}
function cmpFortime(a,b){
  if(isDnf(a) !== isDnf(b)) return isDnf(a) ? 1 : -1;   // 完賽者一律排在未完賽之前
  if(!isDnf(a)) return a.sec - b.sec;                   // 都完賽：比誰快
  return cmpProgress(a,b);                              // 都未完賽：比誰做得多
}
function ranked(m,sx){
  const inner = m.type === "fortime" ? cmpFortime : cmpProgress;
  return m.results.filter(r => r.sex===sx)
    .sort((a,b) => (divTier(a) - divTier(b)) || inner(a,b));
}

/* ---------------- 成績顯示 ---------------- */

function mmss(sec){ return Math.floor(sec/60) + ":" + String(sec%60).padStart(2,"0"); }
function unitOf(u){ return u==="m" ? "m" : u==="cal" ? "cal" : ""; }
function progress(m,r){
  if(!r.part) return r.rounds + " 輪整";
  const st = m.stations[r.st] || {name:"最後一站", unit:"下"};
  return r.rounds + " 輪 + " + st.name + " " + r.part + (st.unit==="下" ? "下" : st.unit);
}
function scoreMain(m,r){
  if(m.type==="fortime") return isDnf(r) ? "CAP" : mmss(r.sec);
  return r.rounds + (r.part ? "+" : "");
}
function scoreSub(m,r){
  if(m.type==="fortime") return isDnf(r) ? progress(m,r) : "完賽";
  return progress(m,r);
}
const esc = s => String(s == null ? "" : s)
  .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");

function drawBoard(){
  const m = cur();
  $("board-kind").textContent = m.type === "amrap"
    ? "AMRAP · " + Math.round(m.cap/60) + " 分鐘"
    : m.rounds + " ROUND FOR TIME";
  $("board-title").textContent = m.title;
  $("board-cap").innerHTML =
    `<span class="k">${m.type === "amrap" ? "限時" : "時間上限"}</span><span class="v">${mmss(m.cap)}</span>`;
  $("board-window").textContent =
    [m.window + " 開放提交", m.isOpen ? "" : "已截止"].filter(Boolean).join("　·　");
  $("board-note").textContent = m.note;
  $("board-note").hidden = !m.note;          // 沒寫說明就不要留空段落

  $("stations").innerHTML = m.stations.map((s,i) => {
    const row = (label, mv, fv, on) => `<div class="st-load ${on ? "" : "dim"}">
        ${label ? `<span class="lv ${label === "Rx" ? "rx" : "sc"}">${label}</span>` : ""}
        <span class="tag m ${formSex==='M'?'':'off'}"><b>男</b>${esc(mv)||"—"}</span>
        <span class="tag f ${formSex==='F'?'':'off'}"><b>女</b>${esc(fv)||"—"}</span></div>`;
    const hasRx = s.rxM || s.rxF, hasSc = s.scM || s.scF;
    let load = "";
    if(hasRx && hasSc){                       // 兩種都有：標出 Rx / SC，你選的那排亮著
      load = row("Rx", s.rxM, s.rxF, formDiv === "rx") + row("SC", s.scM, s.scF, formDiv === "sc");
    }else if(hasRx){
      load = row("", s.rxM, s.rxF, true);     // 只有一種重量就不用標
    }
    return `<li>
      <span class="st-no">${i+1}</span>
      <span class="st-name">${esc(s.name)}${load}</span>
      <span class="st-qty">${s.qty}${unitOf(s.unit)}</span>
    </li>`;
  }).join("");
}

function drawStats(){
  const m = cur(), all = m.results;
  if(!all.length){ $("stats").textContent = "還沒有人挑戰，你可以是第一個。"; return; }
  const parts = ["挑戰人數 <b>" + all.length + "</b> 人"];
  if(m.type === "fortime"){
    const fin = all.filter(r => !isDnf(r));
    parts.push("完賽率 " + Math.round(fin.length / all.length * 100) + "%");
    if(fin.length) parts.push("平均 " + mmss(Math.round(fin.reduce((s,r) => s + r.sec, 0) / fin.length)));
  }else{
    parts.push("平均 " + (all.reduce((s,r) => s + r.rounds, 0) / all.length).toFixed(1) + " 輪");
  }
  $("stats").innerHTML = parts.join("　·　");
}

      <span class="rank ${i<3?'r'+(i+1):''}">${i+1}</span>

  }
  sum.textContent = "交成績";

    <div class="field"><label for="f-rounds">完成輪數</label>

      <div class="row">

        <div class="field"><label for="f-phone">手機號碼</label>

          <button type="button" data-sex="M" aria-pressed="${formSex==='M'}">男子組</button>

  });

function readForm(){
  const m = cur();
  const r = {
    name:($("f-name").value||"").trim(),
    phone:($("f-phone").value||"").replace(/\D/g,""),
    sex:formSex,
    div:formDiv,
    note:($("f-note").value||"").trim()
  };
  if(m.type==="fortime" && formDone){
    r.sec = (+$("f-min").value||0)*60 + (+$("f-sec").value||0);
  }else{
    r.rounds = +$("f-rounds").value||0;
    r.st     = +$("f-st").value||0;
    r.part   = +$("f-part").value||0;
  }
  return r;
}

function updatePreview(){
  const m = cur(), r = readForm();
  if($("f-part-label")){
    const st = m.stations[r.st] || {unit:"下", qty:999};
    $("f-part-label").textContent = "該站已完成（" + (st.unit==="下" ? "下" : st.unit) + "）";
    $("f-part").max = st.qty;
  }
  const filled = isDnf(r) ? (r.rounds > 0 || r.part > 0) : r.sec > 0;
  $("f-preview").textContent = !filled ? "—"
    : (isDnf(r) ? "CAP · " + progress(m,r) : mmss(r.sec));
}

async function onSubmit(e){
  e.preventDefault();
  if(busy) return;
  const m = cur(), r = readForm();
  if(!r.name || r.phone.length < 9) return alert("請填寫姓名與完整手機號碼。");
  if(!isDnf(r) && r.sec <= 0)        return alert("請填寫完成時間。");
  if(!isDnf(r) && r.sec > m.cap)     return alert(`超過時間上限 ${mmss(m.cap)}，請改選「未完賽 (CAP)」並填寫做到哪裡。`);
  if(isDnf(r) && !r.rounds && !r.part) return alert("請填寫做到第幾輪。");

  try{
    localStorage.setItem("peri.name", r.name);
    localStorage.setItem("peri.phone", r.phone);
  }catch(err){}

  const btn = $("f-submit");
  busy = true; btn.disabled = true; btn.setAttribute("aria-busy","true"); btn.textContent = "送出中⋯";

  try{
    if(LIVE){
      const res = await api("submit", Object.assign({monthId:m.id, done:!isDnf(r)}, r));
      if(!res.ok) throw new Error(res.error || "送出失敗");
      setPid(res.pid);
      await reload();
    }else{
      // 示範模式：只改本機資料，不會真的存起來
      r.pid = demoPid(r.name, r.phone);
      r.tail = r.phone.slice(-4);
      const i = m.results.findIndex(x => x.pid === r.pid);
      if(i >= 0) m.results[i] = r; else m.results.push(r);
      setPid(r.pid);
      redraw();
    }
    sex = r.sex;
    document.querySelectorAll(".tab").forEach(t => t.setAttribute("aria-selected", t.dataset.sex===sex));
    drawLeaderboard(); drawHistory();
    document.querySelector(".lb .me")?.scrollIntoView({behavior:"smooth", block:"center"});
  }catch(err){
    alert("送出失敗：" + err.message + "\n\n網路狀況不好時再試一次即可，不會重複記錄。");
  }finally{
    busy = false;
    if($("f-submit")){
      $("f-submit").disabled = false;
      $("f-submit").removeAttribute("aria-busy");
      $("f-submit").textContent = "送出成績";
    }
    if($("f-note")) $("f-note").value = "";
  }
}

function setPid(p){
  myPid = p;
  try{ localStorage.setItem("peri.pid", p); }catch(e){}
}

function drawHistory(){
  if(!myPid){
    $("hist").innerHTML = `<li style="display:block;color:var(--muted-2);font-size:14px;">輸入交成績時填的姓名與手機，就能看到自己每個月的成績與名次。</li>`;
    return;
  }
  const rows = [];
  MONTHS.slice().reverse().forEach(m => {
    const mine = m.results.find(r => r.pid === myPid);
    if(!mine) return;
    const list = ranked(m, mine.sex);
    rows.push({m, mine, rank:list.indexOf(mine)+1, of:list.length});
  });
  if(!rows.length){
    $("hist").innerHTML =
      `<li style="display:block;color:var(--muted-2);font-size:14px;">查無紀錄。確認姓名與手機是否與交成績時填的一致。</li>`;
    return;
  }
  const most = Math.max(...rows.map(r => r.of));
  $("hist").innerHTML = rows.map(r => {
    const pct = Math.max(22, Math.round((r.of - r.rank + 1) / most * 100));   // 名次越前，長條越長
    const label = r.m.type==="fortime" && !isDnf(r.mine) ? mmss(r.mine.sec) : scoreSub(r.m, r.mine);
    return `<li>
      <span class="h-month">${esc(r.m.label)}</span>
      <span class="h-track"><span class="h-fill" style="width:${pct}%"><b>${label}</b></span></span>
      <span class="h-rank">${r.rank}<small>/${r.of}</small></span>
    </li>`;
  }).join("");
}

async function lookup(){
  const name = $("h-name").value.trim(), phone = $("h-phone").value.replace(/\D/g,"");
  if(!name || phone.length < 9) return alert("請填寫姓名與完整手機號碼。");
  try{
    if(LIVE){
      const res = await api("identify", {name, phone});
      if(!res.ok) throw new Error(res.error || "查詢失敗");
      setPid(res.pid);
    }else{
      setPid(demoPid(name, phone));
    }
    drawHistory(); drawLeaderboard();
  }catch(err){
    alert("查詢失敗：" + err.message);
  }
}
const demoPid = (n,p) => "demo-" + n.replace(/\s+/g,"") + "-" + p;

/* ---------------- 載入與重畫 ---------------- */

function redraw(){
  document.querySelector(".wrap").classList.remove("is-loading");
  drawMonths(); drawBoard(); drawStats(); drawTabs(); drawLeaderboard(); drawSubmit(); drawHistory();
}

async function reload(){
  const data = await fetchBootstrap();
  saveSnapshot(data);
  MONTHS = data.months || [];
  if(!MONTHS.some(m => m.id === monthId)){
    monthId = (MONTHS.find(m => m.isOpen) || MONTHS[0] || {}).id;
  }
  if(data.notice) banner(esc(data.notice));
  redraw();
}

async function boot(){
  if(!LIVE){
    MONTHS = DEMO_MONTHS;
    monthId = MONTHS[0].id;
    $("loading").hidden = true;
    banner("<b>示範模式</b> —— 還沒填入後台網址，畫面上的成績都是假資料，交出去不會被保存。把 Apps Script 的網址填進 <code>API_URL</code> 就會連上真的後台。");
    redraw();
    return;
  }

  const snap = loadSnapshot();
  if(snap && snap.months && snap.months.length){     // 先把上次的內容畫出來
    MONTHS = snap.months;
    monthId = (MONTHS.find(m => m.isOpen) || MONTHS[0] || {}).id;
    $("loading").hidden = true;
    redraw();
  }

  try{
    await reload();                                  // 再跟後台對一次，有變就蓋掉
    $("loading").hidden = true;
  }catch(err){
    $("loading").hidden = true;
    if(snap) banner("<b>目前顯示的是上次的內容</b> —— 連不上後台（" + esc(err.message) + "），排行榜可能不是最新的。", true);
    else banner("<b>連不上後台</b> —— " + esc(err.message) +
                "。請確認 Apps Script 已部署為網頁應用程式、存取權限設為「任何人」，網址結尾是 /exec。", true);
  }
}
